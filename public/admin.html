<script>
/* ========================================================
   الجزء 1: المتغيرات العامة
   ======================================================== */

const API_BASE = '';
let state = {
  products: [],
  categories: [],
  orders: [],
  customers: [],
  reviews: [],
  notifications: [],
  settings: {},
  payments: null,
  analytics: null,
  stats: {}
};

let currentUser = null;

/* ========================================================
   الجزء 2: دوال مساعدة للـ API
   ======================================================== */

async function apiCall(endpoint, options = {}) {
  try {
    const response = await fetch(API_BASE + endpoint, {
      headers: { 'Content-Type': 'application/json' },
      ...options
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'خطأ في الطلب');
    return data;
  } catch (error) {
    console.error('API Error:', error);
    throw error;
  }
}

const api = {
  // المصادقة
  login: (phone, password) => apiCall('/api/auth/login', {
    method: 'POST',
    body: JSON.stringify({ phone, password })
  }),

  // الإحصائيات
  getStats: () => apiCall('/api/stats/dashboard'),

  // المنتجات
  getProducts: () => apiCall('/api/products'),
  createProduct: (data) => apiCall('/api/products', { method: 'POST', body: JSON.stringify(data) }),
  updateProduct: (id, data) => apiCall(`/api/products/${id}`, { method: 'PUT', body: JSON.stringify(data) }),
  deleteProduct: (id) => apiCall(`/api/products/${id}`, { method: 'DELETE' }),

  // الفئات
  getCategories: () => apiCall('/api/categories'),
  createCategory: (data) => apiCall('/api/categories', { method: 'POST', body: JSON.stringify(data) }),
  deleteCategory: (id) => apiCall(`/api/categories/${id}`, { method: 'DELETE' }),

  // الطلبات
  getOrders: () => apiCall('/api/orders'),
  getOrder: (id) => apiCall(`/api/orders/${id}`),
  updateOrderStatus: (id, status, note) => apiCall(`/api/orders/${id}/status`, {
    method: 'PUT',
    body: JSON.stringify({ status, note })
  }),

  // العملاء
  getCustomers: () => apiCall('/api/customers'),
  getCustomer: (id) => apiCall(`/api/customers/${id}`),

  // المدفوعات
  getPayments: () => apiCall('/api/payments'),

  // التقييمات
  getReviews: () => apiCall('/api/reviews'),
  approveReview: (id) => apiCall(`/api/reviews/${id}/approve`, { method: 'PUT' }),
  deleteReview: (id) => apiCall(`/api/reviews/${id}`, { method: 'DELETE' }),

  // الإشعارات
  getNotifications: () => apiCall('/api/notifications'),
  markNotificationRead: (id) => apiCall(`/api/notifications/${id}/read`, { method: 'PUT' }),
  markAllNotificationsRead: () => apiCall('/api/notifications/read-all', { method: 'PUT' }),

  // الإعدادات
  getSettings: () => apiCall('/api/settings'),
  updateSettings: (data) => apiCall('/api/settings', { method: 'PUT', body: JSON.stringify(data) }),

  // التحليلات
  getTopProducts: () => apiCall('/api/analytics/top-products')
};

/* ========================================================
   الجزء 3: المصادقة - تسجيل دخول الأدمن
   ======================================================== */

document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const phone = document.getElementById('adminPhone').value.trim();
  const password = document.getElementById('adminPassword').value;
  const btn = e.target.querySelector('button[type="submit"]');

  btn.disabled = true;
  btn.textContent = '⏳ جاري التحقق...';

  try {
    const result = await api.login(phone, password);
    currentUser = result.user;
    sessionStorage.setItem('admin_logged', 'true');
    sessionStorage.setItem('admin_user', JSON.stringify(currentUser));
    showAdminApp();
    showToast(`مرحباً ${currentUser.fullName} 👋`, 'success');
  } catch (error) {
    document.getElementById('loginError').classList.add('show');
    setTimeout(() => document.getElementById('loginError').classList.remove('show'), 3000);
  } finally {
    btn.disabled = false;
    btn.textContent = '🔐 دخول لوحة التحكم';
  }
});

function showAdminApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('adminApp').classList.add('show');
  initApp();
}

function logoutAdmin() {
  if (!confirm('هل تريد تسجيل الخروج من لوحة التحكم؟')) return;
  sessionStorage.removeItem('admin_logged');
  sessionStorage.removeItem('admin_user');
  location.reload();
}

// فحص عند التحميل
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark');
    updateThemeIcon(true);
  }

  if (sessionStorage.getItem('admin_logged') === 'true') {
    currentUser = JSON.parse(sessionStorage.getItem('admin_user') || 'null');
    showAdminApp();
  }
});

/* ========================================================
   الجزء 4: تبديل الوضع المظلم
   ======================================================== */

function toggleTheme() {
  const isDark = document.body.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  updateThemeIcon(isDark);
}

function updateThemeIcon(isDark) {
  const icon = document.getElementById('themeIcon');
  if (!icon) return;
  icon.innerHTML = isDark
    ? `<circle cx="12" cy="12" r="5"></circle>
       <line x1="12" y1="1" x2="12" y2="3"></line>
       <line x1="12" y1="21" x2="12" y2="23"></line>
       <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
       <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
       <line x1="1" y1="12" x2="3" y2="12"></line>
       <line x1="21" y1="12" x2="23" y2="12"></line>
       <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
       <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`
    : `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
}

/* ========================================================
   الجزء 5: التنقل بين الصفحات
   ======================================================== */

const PAGE_INFO = {
  dashboard: { title: 'لوحة التحكم', subtitle: 'نظرة عامة على أداء المتجر' },
  analytics: { title: 'التحليلات', subtitle: 'إحصائيات مفصلة عن المتجر' },
  products: { title: 'المنتجات', subtitle: 'إدارة كتالوج المنتجات' },
  categories: { title: 'الفئات', subtitle: 'تنظيم المنتجات في فئات' },
  orders: { title: 'الطلبات', subtitle: 'متابعة وإدارة الطلبات' },
  payments: { title: 'المدفوعات', subtitle: 'سجل المعاملات المالية' },
  customers: { title: 'العملاء', subtitle: 'قاعدة بيانات العملاء' },
  reviews: { title: 'التقييمات', subtitle: 'تعليقات العملاء' },
  notifications: { title: 'الإشعارات', subtitle: 'كل التنبيهات' },
  settings: { title: 'الإعدادات', subtitle: 'تخصيص المتجر' }
};

async function navigateTo(page) {
  document.querySelectorAll('.section-page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  const pageEl = document.getElementById('page-' + page);
  if (pageEl) pageEl.classList.add('active');

  const navEl = document.querySelector(`.nav-item[data-page="${page}"]`);
  if (navEl) navEl.classList.add('active');

  const info = PAGE_INFO[page] || { title: 'لوحة التحكم', subtitle: '' };
  document.getElementById('pageTitle').textContent = info.title;
  document.getElementById('pageSubtitle').textContent = info.subtitle;

  closeSidebar();

  // تحميل بيانات الصفحة
  try {
    if (page === 'dashboard') await renderDashboard();
    if (page === 'analytics') await renderAnalytics();
    if (page === 'products') await renderProducts();
    if (page === 'categories') await renderCategories();
    if (page === 'orders') await renderOrders();
    if (page === 'payments') await renderPayments();
    if (page === 'customers') await renderCustomers();
    if (page === 'reviews') await renderReviews();
    if (page === 'notifications') await renderNotifications();
    if (page === 'settings') await renderSettings();
  } catch (error) {
    showToast('خطأ في تحميل البيانات', 'error');
  }
}

/* ========================================================
   الجزء 6: الشريط الجانبي
   ======================================================== */

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('active');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
}

/* ========================================================
   الجزء 7: دوال مساعدة
   ======================================================== */

function formatPrice(p) {
  return Number(p || 0).toLocaleString('en-US') + ' د.ج';
}

function formatNumber(n) {
  return Number(n || 0).toLocaleString('en-US');
}

function formatDate(d) {
  if (!d) return '-';
  try {
    const date = new Date(d);
    return date.toLocaleDateString('ar-DZ');
  } catch { return d; }
}

function getStatusBadge(status) {
  const map = {
    pending: { label: 'قيد الانتظار', class: 'warning' },
    confirmed: { label: 'مؤكد', class: 'info' },
    shipped: { label: 'قيد الشحن', class: 'primary' },
    delivered: { label: 'تم التوصيل', class: 'success' },
    cancelled: { label: 'ملغى', class: 'danger' },
    active: { label: 'نشط', class: 'success' },
    inactive: { label: 'غير نشط', class: 'muted' },
    out_of_stock: { label: 'نفد المخزون', class: 'danger' },
    paid: { label: 'مدفوع', class: 'success' },
    unpaid: { label: 'غير مدفوع', class: 'warning' }
  };
  const s = map[status] || { label: status || '-', class: 'muted' };
  return `<span class="badge badge-${s.class}">${s.label}</span>`;
}

function getInitials(name) {
  if (!name) return '؟';
  return name.split(' ').map(w => w[0]).slice(0, 2).join('');
}

function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function openModal(id) { document.getElementById(id).classList.add('active'); }

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

/* ========================================================
   الجزء 8: تهيئة التطبيق
   ======================================================== */

async function initApp() {
  if (currentUser) {
    document.getElementById('adminName').textContent = currentUser.fullName || 'المدير';
    document.getElementById('adminAvatar').textContent = (currentUser.fullName || 'أ').charAt(0);
  }

  try {
    await refreshSidebarCounts();
    await renderDashboard();
  } catch (error) {
    console.error('Init error:', error);
  }
}

async function refreshSidebarCounts() {
  try {
    const stats = await api.getStats();
    state.stats = stats;
    document.getElementById('productsCount').textContent = stats.totalProducts || 0;
    document.getElementById('ordersCount').textContent = stats.pendingOrders || 0;
    document.getElementById('customersCount').textContent = stats.totalCustomers || 0;
    document.getElementById('notifCount').textContent = stats.unreadNotifications || 0;

    const dot = document.getElementById('notifDot');
    if (dot) dot.style.display = (stats.unreadNotifications > 0) ? 'block' : 'none';
  } catch (error) {
    console.error('Counts error:', error);
  }
}

/* ========================================================
   الجزء 9: صفحة الداشبورد
   ======================================================== */

async function renderDashboard() {
  const stats = await api.getStats();
  state.stats = stats;

  animateNumber('statSales', stats.totalSales, 'currency');
  animateNumber('statOrders', stats.totalOrders, 'number');
  animateNumber('statCustomers', stats.totalCustomers, 'number');
  animateNumber('statProducts', stats.totalProducts, 'number');

  // الرسم البياني
  renderSalesChart();

  // الطلبات الأخيرة
  const orders = await api.getOrders();
  state.orders = orders;
  renderRecentOrders();

  // النشاط الأخير
  const notifs = await api.getNotifications();
  state.notifications = notifs;
  renderRecentActivity();

  await refreshSidebarCounts();
}

function animateNumber(id, target, type) {
  const el = document.getElementById(id);
  if (!el) return;
  target = Number(target) || 0;
  const duration = 1000;
  const steps = 40;
  const step = target / steps;
  let current = 0;
  let count = 0;

  const timer = setInterval(() => {
    count++;
    current += step;
    if (count >= steps) { current = target; clearInterval(timer); }
    if (type === 'currency') {
      el.textContent = formatPrice(Math.floor(current));
    } else {
      el.textContent = formatNumber(Math.floor(current));
    }
  }, duration / steps);
}

function renderSalesChart() {
  const chart = document.getElementById('salesChart');
  if (!chart) return;

  const days = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];
  const values = [0, 0, 0, 0, 0, 0, 0];
  const max = Math.max(...values, 1);

  chart.innerHTML = days.map((day, i) => {
    const percent = (values[i] / max) * 100;
    return `
      <div class="chart-bar-wrapper">
        <div class="chart-bar" style="height: ${Math.max(percent, 2)}%;">
          <span class="chart-bar-value">${formatPrice(values[i])}</span>
        </div>
        <span class="chart-label">${day}</span>
      </div>
    `;
  }).join('');
}

function updateChart() { renderSalesChart(); }

function renderRecentOrders() {
  const tbody = document.getElementById('recentOrdersTable');
  if (!tbody) return;

  const recent = state.orders.slice(0, 5);

  if (recent.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 30px; color: var(--text-muted);">لا توجد طلبات بعد</td></tr>`;
    return;
  }

  tbody.innerHTML = recent.map(o => `
    <tr>
      <td><strong>${escapeHtml(o.order_number)}</strong></td>
      <td>${escapeHtml(o.customer_name || 'زائر')}</td>
      <td><strong>${formatPrice(o.total)}</strong></td>
      <td>${getStatusBadge(o.status)}</td>
    </tr>
  `).join('');
}

function renderRecentActivity() {
  const container = document.getElementById('recentActivity');
  if (!container) return;

  const recent = state.notifications.slice(0, 5);
  if (recent.length === 0) {
    container.innerHTML = `<p style="text-align:center; padding:20px; color: var(--text-muted);">لا يوجد نشاط</p>`;
    return;
  }

  const iconMap = { order: '🛒', comment: '💬', user: '👤', alert: '⚠️' };

  container.innerHTML = recent.map(n => `
    <div class="notification-item">
      <div class="notification-icon ${n.type}" style="font-size: 20px;">${iconMap[n.type] || '🔔'}</div>
      <div class="notification-content">
        <div class="notification-text" style="color: var(--text); font-weight: 700;">${escapeHtml(n.title)}</div>
        <div class="notification-time">${formatDate(n.created_at)}</div>
      </div>
    </div>
  `).join('');
}

/* ========================================================
   الجزء 10: إدارة المنتجات
   ======================================================== */

async function renderProducts() {
  const tbody = document.getElementById('productsTable');
  if (!tbody) return;

  tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 30px;">⏳ جاري التحميل...</td></tr>`;

  const [products, categories] = await Promise.all([
    api.getProducts(),
    api.getCategories()
  ]);
  state.products = products;
  state.categories = categories;

  // ملء فلتر الفئات
  const filter = document.getElementById('productCategoryFilter');
  if (filter) {
    const current = filter.value;
    filter.innerHTML = '<option value="">كل الفئات</option>' +
      categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    filter.value = current;
  }

  // ملء نموذج الإضافة
  const select = document.getElementById('productCategory');
  if (select) {
    select.innerHTML = '<option value="">اختر فئة</option>' +
      categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  }

  const search = (document.getElementById('productSearch')?.value || '').toLowerCase();
  const categoryId = document.getElementById('productCategoryFilter')?.value || '';

  const filtered = products.filter(p => {
    const matchSearch = !search || p.name.toLowerCase().includes(search);
    const matchCat = !categoryId || String(p.category_id) === String(categoryId);
    return matchSearch && matchCat;
  });

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-state-icon">📦</div><h3>لا توجد منتجات</h3><p>ابدأ بإضافة منتج جديد</p></div></td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(p => {
    const status = !p.is_active ? 'inactive' : (p.stock === 0 ? 'out_of_stock' : 'active');
    return `
      <tr>
        <td>
          <div class="product-cell">
            <img src="${escapeHtml(p.image_url || 'https://via.placeholder.com/48')}" class="product-thumb" onerror="this.src='https://via.placeholder.com/48'">
            <div class="product-cell-info">
              <div class="product-cell-name">${escapeHtml(p.name)}</div>
              <div class="product-cell-cat">#${p.id}</div>
            </div>
          </div>
        </td>
        <td><span class="badge badge-primary">${escapeHtml(p.category_name || '-')}</span></td>
        <td>
          <div>
            <div style="font-weight: 800;">${formatPrice(p.price)}</div>
            ${p.old_price ? `<div style="font-size: 12px; color: var(--text-muted); text-decoration: line-through;">${formatPrice(p.old_price)}</div>` : ''}
          </div>
        </td>
        <td>
          <span style="color: ${p.stock === 0 ? 'var(--danger)' : p.stock < 10 ? 'var(--warning)' : 'var(--success)'}; font-weight: 800;">${p.stock}</span>
        </td>
        <td>
          <div style="display: flex; align-items: center; gap: 4px;">
            <span style="color: var(--warning); font-weight: 800;">★</span>
            <span>${p.rating || 5}</span>
            <span style="color: var(--text-muted); font-size: 12px;">(${p.reviews_count || 0})</span>
          </div>
        </td>
        <td>${getStatusBadge(status)}</td>
        <td>
          <div class="action-btns">
            <button class="action-btn edit" onclick="editProduct(${p.id})" title="تعديل">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button class="action-btn delete" onclick="deleteProduct(${p.id})" title="حذف">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

function openProductModal() {
  document.getElementById('productForm').reset();
  document.getElementById('productId').value = '';
  document.getElementById('productModalTitle').textContent = 'إضافة منتج جديد';
  document.getElementById('imagePreviewContent').innerHTML = `
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
    <span style="font-weight: 700; font-size: 13px;">اضغط لاختيار صورة</span>
  `;
  openModal('productModal');
}

async function editProduct(id) {
  const product = state.products.find(p => p.id === id);
  if (!product) return;

  document.getElementById('productId').value = product.id;
  document.getElementById('productName').value = product.name;
  document.getElementById('productDescription').value = product.description || '';
  document.getElementById('productCategory').value = product.category_id || '';
  document.getElementById('productStock').value = product.stock;
  document.getElementById('productPrice').value = product.price;
  document.getElementById('productOldPrice').value = product.old_price || '';
  document.getElementById('productModalTitle').textContent = 'تعديل المنتج';

  if (product.image_url) {
    document.getElementById('imagePreviewContent').innerHTML = `<img src="${escapeHtml(product.image_url)}">`;
  }

  openModal('productModal');
}

async function deleteProduct(id) {
  const product = state.products.find(p => p.id === id);
  if (!product) return;
  if (!confirm(`هل تريد حذف "${product.name}"؟`)) return;

  try {
    await api.deleteProduct(id);
    showToast('تم حذف المنتج بنجاح', 'success');
    await renderProducts();
    await refreshSidebarCounts();
  } catch (error) {
    showToast('فشل الحذف: ' + error.message, 'error');
  }
}

function previewImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById('imagePreviewContent').innerHTML = `<img src="${ev.target.result}">`;
  };
  reader.readAsDataURL(file);
}

async function saveProduct(e) {
  e.preventDefault();

  const id = document.getElementById('productId').value;
  const imgEl = document.querySelector('#imagePreviewContent img');
  const imageUrl = imgEl ? imgEl.src : null;

  const data = {
    name: document.getElementById('productName').value.trim(),
    description: document.getElementById('productDescription').value.trim(),
    categoryId: parseInt(document.getElementById('productCategory').value) || null,
    stock: parseInt(document.getElementById('productStock').value) || 0,
    price: parseFloat(document.getElementById('productPrice').value),
    oldPrice: document.getElementById('productOldPrice').value ? parseFloat(document.getElementById('productOldPrice').value) : null,
    imageUrl: imageUrl,
    isActive: true
  };

  try {
    if (id) {
      await api.updateProduct(id, data);
      showToast('تم تحديث المنتج ✏️', 'success');
    } else {
      await api.createProduct(data);
      showToast('تمت إضافة المنتج ✅', 'success');
    }
    closeModal('productModal');
    await renderProducts();
    await refreshSidebarCounts();
  } catch (error) {
    showToast('فشل الحفظ: ' + error.message, 'error');
  }
}

/* ========================================================
   الجزء 11: إدارة الفئات
   ======================================================== */

async function renderCategories() {
  const grid = document.getElementById('categoriesGrid');
  if (!grid) return;

  const categories = await api.getCategories();
  state.categories = categories;

  if (categories.length === 0) {

function openCategoryModal() {
  document.getElementById('categoryName').value = '';

async function saveCategory(e) {
  e.preventDefault();
  const name = document.getElementById('categoryName').value.trim();
  const icon = document.getElementById('categoryIcon').value.trim() || '📦';

  try {
    await api.createCategory({ name, icon });

async function deleteCategory(id) {
  const cat = state.categories.find(c => c.id === id);

  try {
    await api.deleteCategory(id);

/* ========================================================
   الجزء 19: Toast
   ======================================================== */

let toastTimeout;
function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  document.getElementById('toastIcon').textContent = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
  document.getElementById('toastText').textContent = message;
  toast.className = 'toast ' + type;
  setTimeout(() => toast.classList.add('show'), 10);
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
}

/* ========================================================
   الجزء 20: إغلاق النوافذ
   ======================================================== */

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('active');
  });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
  }
});
